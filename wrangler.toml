name = "canvas-run"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Production configuration
[env.production]
routes = [
  { pattern = "canvas.run/*", zone_name = "canvas.run" }
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "canvas-run-prod"
database_id = "YOUR_PRODUCTION_DATABASE_ID"

[[env.production.assets]]
binding = "ASSETS"
# This will serve files from client/dist
directory = "./client/dist"

# Development/preview configuration
[[d1_databases]]
binding = "DB"
database_name = "canvas-run-dev"
database_id = "YOUR_DEV_DATABASE_ID"

# You can test locally with this
# Run: wrangler d1 create canvas-run-dev
# Run: wrangler d1 execute canvas-run-dev --file=./src/db/schema.sql

# Local assets for development
[[assets]]
binding = "ASSETS"
directory = "./client/dist"
